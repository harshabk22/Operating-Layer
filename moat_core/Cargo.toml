[package]
name = "moat_core"
version = "0.1.0"
edition = "2021"

[dependencies]
real-estate-v1 = { path = "../real-estate-v1" }
dashmap = "5.5"
tokio = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
bincode = "1.3"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dotenvy = "0.15.7"
async-trait = "0.1"
dirs = "5"
rusqlite = "0.39.0"
bit-vec = "0.9.1"
url = "2.5"
serde_yaml = "0.9"
sha2 = "0.10"
regex = "1"
anyhow = "1.0"
toml = "0.8"
base64 = "0.22"
libc = "0.2"
semver = "1.0"
tiktoken-rs = "0.11.0"
axum = { version = "0.7", features = ["ws"] }
urlencoding = "2.1.3"


[features]
default = []

[[bin]]
name = "moat-core"
path = "src/main.rs"
