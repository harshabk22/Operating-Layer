version: '3.8'

services:
  backend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - moat_data:/root/.ageex
    environment:
      - PORT=8080
      - WHATSAPP_PORT=8081
      - AGEEX_PROVIDER=local
      - AGEEX_MODEL=stub
      - OPENAI_API_KEY=stub
      - OWNER_PASSWORD=owner
      - OPERATOR_PASSWORD=operator
      - NON_INTERACTIVE=1

  frontend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  moat_data:
